<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="gmt-mail logo">
  <title>gmt-mail</title>
  <!-- bulk: two envelopes behind -->
  <g stroke="#1f3a5f" stroke-width="10" stroke-linejoin="round">
    <rect x="128" y="86" width="300" height="200" rx="22" fill="#cfe3f7" transform="rotate(8 278 186)"/>
    <rect x="106" y="106" width="300" height="200" rx="22" fill="#e3effb" transform="rotate(4 256 206)"/>
  </g>
  <!-- mascot envelope -->
  <g stroke="#1f3a5f" stroke-width="12" stroke-linejoin="round" stroke-linecap="round">
    <rect x="76" y="140" width="320" height="216" rx="26" fill="#ffffff"/>
    <path d="M86 156 L236 268 L386 156" fill="none"/>
  </g>
  <!-- face -->
  <circle cx="190" cy="300" r="13" fill="#1f3a5f"/>
  <circle cx="282" cy="300" r="13" fill="#1f3a5f"/>
  <circle cx="195" cy="295" r="4" fill="#ffffff"/>
  <circle cx="287" cy="295" r="4" fill="#ffffff"/>
  <path d="M214 322 Q236 340 258 322" fill="none" stroke="#1f3a5f" stroke-width="9" stroke-linecap="round"/>
  <circle cx="162" cy="326" r="11" fill="#f6a5a5"/>
  <circle cx="310" cy="326" r="11" fill="#f6a5a5"/>
  <!-- terminal badge -->
  <g transform="translate(330 300)">
    <rect width="132" height="96" rx="18" fill="#2e8b57" stroke="#1f3a5f" stroke-width="10"/>
    <path d="M26 30 L50 48 L26 66" fill="none" stroke="#ffffff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M62 70 H104" stroke="#ffffff" stroke-width="11" stroke-linecap="round"/>
  </g>
  <!-- wordmark -->
  <text x="256" y="470" text-anchor="middle" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="58" font-weight="bold" fill="#e6edf3">gmt-mail</text>
</svg>
